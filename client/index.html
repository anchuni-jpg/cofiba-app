<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Tablets (pantalla táctil grande): la app está pensada para ~480px de
         ancho. En vez de estirarla o dejarla pequeña, se le dice al navegador
         que la pinte a 480px de ancho y la escale a toda la pantalla, como una
         app nativa: llena el ancho exacto, todo (letras, botones, fotos y
         ventanas como la ficha) crece en proporción y la altura es la real,
         así que no aparece scroll donde no hace falta. En apaisado se usa el
         mismo aumento, con más ancho útil. Móviles y ordenadores, sin cambios. -->
    <script>
      (function () {
        var BASE = 480;
        function ajustar() {
          try {
            var meta = document.querySelector('meta[name="viewport"]');
            if (!meta) return;
            var tactil = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            var corto = Math.min(screen.width, screen.height);
            var largo = Math.max(screen.width, screen.height);
            if (!tactil || corto < 600) {
              // Móvil u ordenador: el ajuste normal de siempre.
              meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
              return;
            }
            var apaisado = window.matchMedia('(orientation: landscape)').matches;
            var escala = corto / BASE;
            var ancho = Math.round((apaisado ? largo : corto) / escala);
            var e = escala.toFixed(3);
            meta.setAttribute(
              'content',
              'width=' + ancho + ', initial-scale=' + e + ', minimum-scale=' + e + ', maximum-scale=' + e + ', user-scalable=no, viewport-fit=cover'
            );
          } catch (err) {
            // Si algo falla, se queda el viewport normal.
          }
        }
        ajustar();
        window.addEventListener('orientationchange', function () { setTimeout(ajustar, 150); });
        try { window.matchMedia('(orientation: landscape)').addEventListener('change', ajustar); } catch (err) {}
      })();
    </script>
    <meta name="theme-color" content="#20944b" id="meta-theme-color" />
    <!-- Bloqueante y a propósito lo primero del <head>: decide el tema
         ANTES de que se pinte nada, para no enseñar un parpadeo claro→oscuro
         al cargar con el modo oscuro ya elegido de una vez anterior. -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('cofiba:tema');
          var tema = guardado || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {
          // localStorage bloqueado (modo privado estricto) — se queda en claro.
        }
      })();
    </script>
    <!-- iOS Safari no lee bien el manifest.webmanifest para el modo "app
    instalada" — sin estas etiquetas, añadir a pantalla de inicio en iPhone
    abre Safari con barras de navegador en vez de a pantalla completa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cofiba" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Cofiba · Visor de pedidos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
